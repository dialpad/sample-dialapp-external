# Dependencies and tool settings for the server's tests, lint, types and style. Not a package: tox
# installs requirements.txt plus the dependency groups below, and runs everything from server/.
# Ruff, yapf and ty are configured like Dialpad's own Python services.

[dependency-groups]
# PEP 735 groups; tox installs them per environment, and `pip install --group dev` (with
# `-r requirements.txt`) sets up a local virtual environment for everything.
test = [
    "pytest>=9",
    "pytest-asyncio",
    "sanic-testing",
    # Builds the Dialpad-format idtokens that tests/vectors/ and test_idtoken.py decode.
    "python-jose[cryptography]",
]
lint = ["ruff"]
typecheck = [{ include-group = "test" }, "ty"]
style = ["yapf"]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "typecheck" },
    { include-group = "style" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Puts server/ on the import path, so the tests can `import acme_dialpad_rightbar`.
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
filterwarnings = [
    "error",
    # Sanic's test client pulls in websockets' deprecated legacy module.
    "ignore:websockets.legacy is deprecated:DeprecationWarning",
    # Python 3.14 warns about a `return` in a `finally` block in Sanic's own source when it first
    # compiles it (pip precompiles on install, uv doesn't), which `error` would turn into a
    # SyntaxError at import.
    "ignore:'return' in a 'finally' block:SyntaxWarning",
]

[tool.ruff]
# yapf formats (column_limit in .style.yapf). Ruff only lints, but its line-too-long rule (E501)
# still catches the comments, docstrings and strings yapf can't wrap, so this must match yapf.
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["ALL"]

# Blanket ignores - conventions ruff's ALL preset disagrees with, not per-file exceptions.
ignore = [
    # No file in this repository carries a copyright header.
    "CPY001",
    # TODOs follow `# TODO <TICKET> (<author>): <description>`, which ruff's TODO rules
    # don't recognise; FIX002 adds no signal beyond TD002-004.
    "TD002", "TD003", "TD004",
    "FIX002",
    # Conflicts with .style.yapf's blank_line_before_nested_class_or_def = false. yapf is the
    # formatter of record.
    "D204",
    # D203/D211 and D212/D213 are mutually exclusive pairs; ignoring the losing half silences
    # ruff's warning on every run.
    "D203", "D213",
    # Trailing commas are yapf's job.
    "COM812", "COM819",
]

[tool.ruff.lint.per-file-ignores]
# pytest idioms: bare asserts, fixture arguments, magic values.
"tests/**" = ["S101", "PLR2004", "ARG001", "S105", "S106", "D102", "D103", "D107"]
# Sanic reads a handler's annotations when the route is registered, so `Request` and `HTTPResponse`
# must be real imports there, not `if TYPE_CHECKING:` ones.
"acme_dialpad_rightbar/dialpad/endpoints/**" = ["TC002"]
"acme_dialpad_rightbar/connect/callback.py" = ["TC002"]
"acme_dialpad_rightbar/crm/**" = ["TC002"]
"acme_dialpad_rightbar/demo/endpoints/**" = ["TC002"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

# One import per line: Ruff's wrapped imports indent by 2 and yapf's by 4, so avoid wrapping.
[tool.ruff.lint.isort]
force-single-line = true

[tool.ty.environment]
python-version = "3.14"

[tool.ty.rules]
all = "error"
