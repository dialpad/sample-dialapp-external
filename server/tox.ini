# Run with `tox` or `uvx tox` (tox 4). The runtime dependencies come from requirements.txt and the
# tools from pyproject.toml's [dependency-groups]; server/ isn't a package, so nothing is built or
# installed from it.
[tox]
# tox-uv builds the environments with uv, which uses an interpreter already on the machine and
# downloads a uv-managed one only when it's missing.
requires = tox-uv>=1.36
env_list = tests, linter, typechecker, check_python_code_style
skip_missing_interpreters = false

[testenv]
description = Run the server's tests
# Every environment runs on 3.14, whichever Python tox itself runs on.
base_python = python3.14
skip_install = true
deps = -r{toxinidir}/requirements.txt
dependency_groups = test
commands =
    pytest {posargs}

[testenv:tests]

[testenv:linter]
description = Lint the server and its tests with ruff
deps =
dependency_groups = lint
commands =
    ruff check acme_dialpad_rightbar tests {posargs}

[testenv:typechecker]
description = Run ty on the server and its tests (strict - all rules as errors), checking against Python 3.14
dependency_groups = typecheck
commands =
    ty check --python {envpython} acme_dialpad_rightbar tests {posargs}

[testenv:check_python_code_style]
description = Check Python code style using yapf
deps =
dependency_groups = style
commands =
    yapf --style {toxinidir}/.style.yapf -p --diff --recursive {posargs:acme_dialpad_rightbar tests}

[testenv:apply_python_code_style]
description = Apply Python code style using yapf
deps =
dependency_groups = style
commands =
    yapf --style {toxinidir}/.style.yapf -p -i --recursive {posargs:acme_dialpad_rightbar tests}
