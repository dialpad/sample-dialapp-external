name: CI

concurrency:
  # Cancel a pull request's previous runs when it gets new commits.
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CI: '1'

jobs:
  server-checks:
    name: Server tests, lint, types and style
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      # Each check runs independently (continue-on-error) so one failure doesn't hide the others.
      # The last step fails the job if any of them failed.
      - name: Tests (pytest)
        id: tests
        continue-on-error: true
        working-directory: server
        run: uvx tox -e tests

      - name: Linter (Ruff)
        id: linter
        continue-on-error: true
        working-directory: server
        run: uvx tox -e linter

      - name: Type checker (ty)
        id: typechecker
        continue-on-error: true
        working-directory: server
        run: uvx tox -e typechecker

      - name: Code style (yapf)
        id: style
        continue-on-error: true
        working-directory: server
        run: uvx tox -e check_python_code_style

      - name: Check results
        if: always()
        run: |
          echo "Tests: ${{ steps.tests.outcome }}"
          echo "Linter: ${{ steps.linter.outcome }}"
          echo "Type checker: ${{ steps.typechecker.outcome }}"
          echo "Code style: ${{ steps.style.outcome }}"
          if [ "${{ steps.tests.outcome }}" != "success" ] || [ "${{ steps.linter.outcome }}" != "success" ] || [ "${{ steps.typechecker.outcome }}" != "success" ] || [ "${{ steps.style.outcome }}" != "success" ]; then
            echo "::error::At least one check failed."
            exit 1
          fi

  client-checks:
    name: Client lint, format, types, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install
        working-directory: client
        run: corepack enable && pnpm install --frozen-lockfile

      - name: Lint (ESLint)
        id: lint
        continue-on-error: true
        working-directory: client
        run: pnpm lint:ci

      # Also checks the README, FLOWS.md and the other Markdown files it lists.
      - name: Format (Prettier)
        id: format
        continue-on-error: true
        working-directory: client
        run: pnpm format:ci

      - name: Types (vue-tsc)
        id: types
        continue-on-error: true
        working-directory: client
        run: pnpm types:check

      - name: Unit tests (Vitest)
        id: test
        continue-on-error: true
        working-directory: client
        run: pnpm test:run

      # Type-checks and bundles the panel the way the Docker image does.
      - name: Build (Vite)
        id: build
        continue-on-error: true
        working-directory: client
        run: pnpm build

      - name: Check results
        if: always()
        run: |
          echo "Lint: ${{ steps.lint.outcome }}"
          echo "Format: ${{ steps.format.outcome }}"
          echo "Types: ${{ steps.types.outcome }}"
          echo "Unit tests: ${{ steps.test.outcome }}"
          echo "Build: ${{ steps.build.outcome }}"
          if [ "${{ steps.lint.outcome }}" != "success" ] || [ "${{ steps.format.outcome }}" != "success" ] || [ "${{ steps.types.outcome }}" != "success" ] || [ "${{ steps.test.outcome }}" != "success" ] || [ "${{ steps.build.outcome }}" != "success" ]; then
            echo "::error::At least one check failed."
            exit 1
          fi

  e2e:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # Playwright starts the server as `.venv/bin/python -m acme_dialpad_rightbar` from server/,
      # so that folder needs its own virtual environment with the runtime packages.
      - name: Set up the server
        working-directory: server
        run: |
          uv venv --python 3.14 .venv
          uv pip install --python .venv/bin/python -r requirements.txt

      - name: Install the client
        working-directory: client
        run: corepack enable && pnpm install --frozen-lockfile

      - name: Install the browser
        working-directory: client
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser tests
        working-directory: client
        run: pnpm test:e2e

      - name: Upload the traces of failed tests
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-test-results
          path: client/test-results
          if-no-files-found: ignore

  container:
    name: Docker image builds and starts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the image
        run: docker build -f deployment/Dockerfile -t acme-ci .

      # The same four settings a deployment passes. The client secret is this app's public test
      # secret, not a real one.
      - name: Start the container and check it answers
        run: |
          docker run -d --name acme-ci -p 8080:8080 \
            -e DIALPAD_CLIENT_SECRET=test-client-secret-0123456789-abcdefghijklmnopqrst \
            -e APP_SECRET=ci-app-secret \
            -e DIALPAD_ORIGIN=https://dialpadbeta.com \
            -e BASE_URL=http://localhost:8080 \
            acme-ci
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8080/healthz > /dev/null && break
            sleep 1
          done
          echo "healthz: $(curl -s http://localhost:8080/healthz)"
          page_status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/)
          echo "page without an idtoken: $page_status"
          [ "$(curl -s http://localhost:8080/healthz)" = "ok" ] && [ "$page_status" = "401" ]

      - name: Show the container's log
        if: failure()
        run: docker logs acme-ci

  # The one required check: passes only when every job above passed.
  sample-dialapp-external-check:
    name: sample-dialapp-external check
    if: always()
    runs-on: ubuntu-latest
    needs:
      - server-checks
      - client-checks
      - e2e
      - container
    steps:
      - name: Fail if any job failed or was cancelled
        if:
          contains(needs.*.result, 'failure') || contains(needs.*.result,
          'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "::error::At least one job failed: ${{ toJSON(needs) }}"
          exit 1
