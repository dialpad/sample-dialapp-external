# Install scripts: every dependency that has one is listed. None is needed here: vue-demi's
# postinstall only picks a Vue version to link against, and Vue 3 is already the default.
allowBuilds:
  vue-demi: false

# Supply-chain checks on top of pnpm's defaults (strictDepBuilds, a minimumReleaseAge):
# refuse a version whose publishing evidence is weaker than its predecessors'...
trustPolicy: no-downgrade
# ...transitive dependencies from git or tarball URLs...
blockExoticSubdeps: true
# ...and installs on a Node version outside a package's engines.
engineStrict: true
# `pnpm add` saves exact versions, without a `^`, so a dependency changes only when someone adds
# its new version (and, for the SDK, its matching contract/openapi.json) in one commit.
saveExact: true
# Dialpad's own SDK is exempt from the minimum release age, so a new SDK version installs on
# the day it's published.
minimumReleaseAgeExclude:
  - '@dialpad/dialapp-external-sdk'
