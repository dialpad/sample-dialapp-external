<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Acme for Dialpad: dev host (stands in for Dialpad)</title>
    <style>
      /*
       * The border outlines the iframe, so its width and height are visible. The mock host sets
       * width, height and "border: 0" inline on the iframe, so only !important can win; with
       * border-box sizing the border sits inside those dimensions.
       */
      #panel iframe {
        box-sizing: border-box;
        border: 1px dashed #c0392b !important;
      }
    </style>
  </head>
  <body>
    <h1>Dev host</h1>
    <p>
      This page stands in for Dialpad. It frames the app below with a mock
      idtoken, answers its
      <code>init</code>
      , and never replies to Connect, like the desktop app.
    </p>
    <div>
      <button id="change-contact" type="button">Change contact</button>
      <button id="change-call-state" type="button">Change call state</button>
      <button id="toggle-theme" type="button">Switch light / dark</button>
    </div>
    <div id="panel" style="width: 300px"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
