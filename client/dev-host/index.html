<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Acme for Dialpad: dev host (stands in for Dialpad)</title>
    <style>
      /*
       * The border outlines the iframe, so its width and height are visible. The mock host sets
       * width, height and "border: 0" inline on the iframe, so only !important can win; with
       * border-box sizing the border sits inside those dimensions.
       */
      #panel iframe {
        box-sizing: border-box;
        border: 1px dashed #c0392b !important;
      }
    </style>
  </head>
  <body>
    <h1>Dev host</h1>
    <p>
      This page stands in for Dialpad. It frames the app below with a mock
      idtoken, answers its
      <code>init</code>
      , and never replies to Connect, like the desktop app.
    </p>
    <p>
      Panel width:
      <a href="./">right sidebar (318 px)</a>
      ·
      <a href="./?dpe">DPE (250 px)</a>
      . Showing:
      <strong id="panel-name"></strong>
    </p>
    <div>
      <button id="change-contact" type="button">Change contact</button>
      <button id="change-call-state" type="button">Change call state</button>
      <button id="toggle-theme" type="button">Switch light / dark</button>
      <button id="disconnect-from-menu" type="button">
        Disconnect from Dialpad's menu
      </button>
    </div>
    <div id="panel"></div>
    <section aria-labelledby="toasts-heading">
      <h2 id="toasts-heading">Toasts</h2>
      <p>Dialpad shows these over its own UI, outside the panel.</p>
      <ul id="toasts" aria-live="polite"></ul>
    </section>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
